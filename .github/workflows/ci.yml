name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Some tests read the prerendered pages, so build first.
      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      # Mobile Lighthouse on the built site (local server, no compression, so
      # speed scores read lower than the live site). Fails the PR if a page drops
      # below the thresholds in lighthouserc.json.
      - name: Lighthouse
        run: npx --yes @lhci/cli@0.15.1 autorun --config=lighthouserc.json

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: .lighthouseci
          if-no-files-found: ignore
